<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    echo app icon, classic .icns render: the Facet Split composition
    (see echo-icon-facet-split.svg, the full-bleed source of truth)
    pre-masked into the Apple icon-grid squircle (824px rounded rect,
    100px transparent margin, r=185 approximating Apple's superellipse).
    Classic icns icons are NOT masked by macOS - verified 2026-08-26,
    a full-bleed square renders as a raw square in the dock - so the
    shape must be baked in here. The full-bleed unmasked variant remains
    the right input for an Icon Composer .icon package, where the OS
    does apply the mask.
  -->
  <defs>
    <path id="outline" d="M280,84
      C 240,86 214,100 206,124
      L 146,142 L 204,160
      C 196,196 178,240 172,296
      C 168,340 178,378 200,404
      L 232,416 L 276,416
      C 300,416 330,410 352,398
      L 398,386
      C 394,330 398,270 390,210
      C 382,140 340,90 280,84 Z"/>
    <clipPath id="clip"><use href="#outline"/></clipPath>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <g transform="translate(100,100) scale(0.8046875)">
      <rect width="1024" height="1024" fill="#3B1D8F"/>
      <polygon points="0,1024 1024,0 1024,1024" fill="#2E1065"/>
      <g transform="translate(512,512) scale(0.92) translate(-526,-524)">
        <g transform="scale(2)">
          <use href="#outline" fill="#5B21B6"/>
          <g clip-path="url(#clip)">
            <polygon points="206,124 280,84 256,150" fill="#A78BFA"/>
            <polygon points="280,84 350,120 256,150" fill="#7C3AED"/>
            <polygon points="206,124 256,150 204,162" fill="#8B5CF6"/>
            <polygon points="256,150 350,120 310,220" fill="#6D28D9"/>
            <polygon points="256,150 310,220 244,236" fill="#7C3AED"/>
            <polygon points="350,120 392,230 310,220" fill="#5B21B6"/>
            <polygon points="310,220 392,230 340,320" fill="#6D28D9"/>
            <polygon points="392,230 394,340 340,320" fill="#4C1D95"/>
            <polygon points="340,320 394,340 360,398" fill="#5B21B6"/>
            <polygon points="244,236 310,220 268,320" fill="#6D28D9"/>
            <polygon points="268,320 340,320 300,410" fill="#4C1D95"/>
            <polygon points="340,320 360,398 300,410" fill="#6D28D9"/>
            <polygon points="200,148 128,250 244,236" fill="#BFDBFE"/>
            <polygon points="128,250 150,400 244,236" fill="#60A5FA"/>
            <polygon points="244,236 150,400 268,320" fill="#93C5FD"/>
            <polygon points="268,320 150,400 250,440" fill="#BFDBFE"/>
            <polygon points="268,320 250,440 310,430" fill="#93C5FD"/>
            <polygon points="208,122 146,142 206,162" fill="#2F7CF6"/>
            <polygon points="180,136 146,142 182,154" fill="#60A5FA"/>
            <polygon points="300,240 330,350 280,330" fill="#2563EB"/>
            <polygon points="300,240 280,330 266,260" fill="#3B82F6"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
